[workspace]
resolver = "2"
members = [
    "crates/domain",
    "crates/persistence",
    "crates/ingestion",
    "crates/identity",
    "crates/features",
    "crates/models",
    "crates/simulation",
    "crates/scoring",
    "crates/evaluation",
    "crates/governance",
    "crates/application",
    "crates/ffi",
]

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2021"
authors = ["GRID-Alpha Team"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/Seismic-Fate/GRID-Alpha"

[workspace.dependencies]
tokio = { version = "1.40", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate", "chrono"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"
nalgebra = "0.33"
sprs = "0.11"
statrs = "0.17"
rayon = "1.10"
flutter_rust_bridge = "2.5.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }